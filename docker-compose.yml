services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agrisaarthi-postgres
    environment:
      POSTGRES_USER: agrisaarthi
      POSTGRES_PASSWORD: agrisaarthi123
      POSTGRES_DB: agrisaarthi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisaarthi"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: agrisaarthi-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrisaarthi-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://agrisaarthi:agrisaarthi123@postgres:5432/agrisaarthi
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      AI_PROVIDER: ollama
      IBM_WATSONX_API_KEY: ""
      IBM_WATSONX_PROJECT_ID: ""
      IBM_WATSONX_URL: https://us-south.ml.cloud.ibm.com
      IBM_GRANITE_MODEL: ibm/granite-13b-instruct-v2
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrisaarthi-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  ollama_data:
